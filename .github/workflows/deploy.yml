name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Backend Tests
      run: |
        cd backend
        # Add your testing suites here (e.g., npm run test)

    - name: Build Frontend
      run: |
        cd frontend
        CI=false npm run build

    - name: Deploy to Cloud Platform / Server
      run: |
        echo "Replace this step with your SSH / Server deployment script (e.g. Render, AWS, or DigitalOcean deploy steps)"
        # Example: rsync -avz --delete ./dist user@server:/var/www/site/